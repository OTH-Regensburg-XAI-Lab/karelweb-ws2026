<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Karel Studio Integrations- und Testseite."
    />
    <title>Karel Studio · Testlabor</title>
    <script type="module" crossorigin src="/assets/test-ZEtF24PH.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/dist-cO78BjzP.js">
    <link rel="modulepreload" crossorigin href="/assets/codemirror-6-adapter-CRth9zTh.js">
    <link rel="stylesheet" crossorigin href="/assets/test-B2huIYVU.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div>
          <p class="kicker">Testlabor</p>
          <h1>Karel Studio</h1>
        </div>
        <div class="header-copy">
          <p class="lede">
            Fixtures, Welteditor, JSON-Austausch und Entwicklerdaten.
          </p>
          <a class="text-link" href="/">Zur Programmieransicht</a>
        </div>
      </header>
      <karel-runner name="answer" test-mode></karel-runner>
      <section class="lab-tools" aria-label="Testwerkzeuge">
        <h2>Fixtures</h2>
        <label
          >Fixture
          <select id="fixture">
            <option value="">Fixture wählen …</option>
          </select></label
        >
        <button id="load-fixture" type="button">Laden</button>
        <button id="discard-plan" type="button">Ausführung verwerfen</button>
        <p id="lab-message" aria-live="polite"></p>
      </section>
      <section
        class="world-editor-section"
        aria-labelledby="world-editor-title"
      >
        <div class="section-heading">
          <p class="kicker">Tiled-artiger Editor</p>
          <h2 id="world-editor-title">Ausgangswelt gestalten</h2>
          <p class="lede">
            Karel, Beeper und Wände direkt zeichnen; Änderungen werden in den
            Runner übernommen.
          </p>
        </div>
        <karel-world-editor></karel-world-editor>
      </section>
    </main>
  </body>
</html>
