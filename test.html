<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      id="page-description"
      data-i18n-key="testlab.description"
      content="Create and try Karel worlds."
    />
    <title data-i18n-key="testlab.title">Karel Studio · World Editor</title>
    <link rel="stylesheet" href="/karelweb-ws2026/assets/site-footer.css" />
    <script
      type="module"
      crossorigin
      src="/karelweb-ws2026/assets/test-en-0a0bfb6aa4.js"
    ></script>
    <link
      rel="modulepreload"
      crossorigin
      href="/karelweb-ws2026/assets/codemirror-6-adapter-en-0a0bfb6aa4.js"
    />
    <link
      rel="stylesheet"
      crossorigin
      href="/karelweb-ws2026/assets/test-DRPn5hLC.css"
    />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div>
          <h1>Karel Studio</h1>
        </div>
        <div class="header-copy">
          <a
            class="text-link"
            href="/karelweb-ws2026/"
            data-i18n-key="testlab.backToEditor"
            >Program</a
          >
        </div>
      </header>
      <karel-runner name="answer" test-mode></karel-runner>
      <section class="lab-tools" aria-labelledby="examples-title">
        <h2 id="examples-title" data-i18n-key="testlab.fixtures">Examples</h2>
        <div class="fixture-picker">
          <label for="fixture" data-i18n-key="testlab.fixtureLabel"
            >Example</label
          >
          <select id="fixture">
            <option value="" data-i18n-key="testlab.chooseFixture">
              Choose an example …
            </option>
          </select>
        </div>
        <button
          id="load-fixture"
          type="button"
          data-i18n-key="testlab.loadFixture"
        >
          Load
        </button>
        <button
          id="discard-plan"
          type="button"
          data-i18n-key="testlab.discardPlan"
        >
          Discard run
        </button>
        <p id="lab-message" aria-live="polite"></p>
      </section>
      <section
        class="world-editor-section"
        aria-labelledby="world-editor-title"
      >
        <div class="section-heading">
          <h2 id="world-editor-title" data-i18n-key="testlab.editorTitle">
            Starting world
          </h2>
        </div>
        <karel-world-editor></karel-world-editor>
      </section>
    </main>
    <footer class="site-footer">
      <p>2026 OTH Regensburg, Project ADKI, XAI Lab</p>
      <nav aria-label="Project links">
        <a
          href="https://informatik-mathematik.oth-regensburg.de/personen/detailansicht/stephan-scheele"
          >Prof. Dr. Stephan Scheele</a
        >
        <a
          href="https://www.oth-regensburg.de/personen/detailansicht/titus-dose"
          >Prof. Dr. Titus Dose</a
        >
        <a href="/karelweb-ws2026/THIRD_PARTY_NOTICES.txt"
          >Third-party licenses</a
        >
      </nav>
    </footer>
  </body>
</html>
